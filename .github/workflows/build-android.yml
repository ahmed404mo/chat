name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXT_PUBLIC_APP_URL: https://chat-five-rho-38.vercel.app
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}

      - name: Generate Android icons
        run: |
          mkdir -p resources
          cp public/icon.png resources/icon.png
          npx capacitor-assets generate --android --iconBackgroundColor '#111827'

      - name: Sync Capacitor
        run: npx cap sync

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Set version in build.gradle
        run: |
          VERSION=$(node -p "require('./package.json').version")
          VERSION_CODE=$(date -u '+%Y%m%d')
          sed -i "s/versionCode 1/versionCode $VERSION_CODE/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"$VERSION\"/" android/app/build.gradle
          echo "APK_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Build Android APK (debug)
        run: ./gradlew assembleDebug
        working-directory: android

      - name: Rename APK with version
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/mentora-v${{ env.APK_VERSION }}.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mentora-v${{ env.APK_VERSION }}
          path: android/app/build/outputs/apk/debug/mentora-v${{ env.APK_VERSION }}.apk
