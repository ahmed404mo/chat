name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      build-type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
  push:
    branches: [main]
    paths:
      - 'mentora_flutter/**'
      - '.github/workflows/flutter-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create fresh Flutter project
        run: |
          cd /tmp
          flutter create --org com.company --project-name mentora mentora_build
          echo "Flutter project created"

      - name: Set minSdkVersion to 23 (required by record_android)
        run: |
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' /tmp/mentora_build/android/app/build.gradle
          sed -i 's/minSdkVersion 21/minSdkVersion 23/' /tmp/mentora_build/android/app/build.gradle
          sed -i 's/minSdkVersion 21/minSdkVersion 23/' /tmp/mentora_build/android/build.gradle 2>/dev/null || true
          echo "=== Checking minSdkVersion ==="
          grep -n 'minSdk' /tmp/mentora_build/android/app/build.gradle /tmp/mentora_build/android/build.gradle 2>/dev/null || echo "No minSdk found"
          echo "=== Done ==="

      - name: Copy our app code
        run: |
          rm -rf /tmp/mentora_build/lib/*
          rm -f /tmp/mentora_build/pubspec.yaml
          cp -r mentora_flutter/lib/* /tmp/mentora_build/lib/
          cp mentora_flutter/pubspec.yaml /tmp/mentora_build/pubspec.yaml
          cp -r mentora_flutter/l10n.yaml /tmp/mentora_build/ 2>/dev/null || true
          cp -r mentora_flutter/l10n /tmp/mentora_build/ 2>/dev/null || true
          cp mentora_flutter/android/app/google-services.json /tmp/mentora_build/android/app/google-services.json 2>/dev/null || true
          echo "Code copied"

      - name: Flutter pub get
        run: flutter pub get
        working-directory: /tmp/mentora_build

      - name: Generate localizations
        run: flutter gen-l10n
        working-directory: /tmp/mentora_build

      - name: Build APK
        run: flutter build apk --debug --no-tree-shake-icons
        working-directory: /tmp/mentora_build

      - name: Rename APK
        run: |
          TIMESTAMP=$(date -u '+%Y%m%d_%H%M%S')
          cp build/app/outputs/flutter-apk/app-debug.apk \
             build/app/outputs/flutter-apk/mentora-flutter-debug-$TIMESTAMP.apk
        working-directory: /tmp/mentora_build

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mentora-flutter-apk
          path: /tmp/mentora_build/build/app/outputs/flutter-apk/mentora-flutter-*.apk
          if-no-files-found: error
